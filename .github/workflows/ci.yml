name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, ad-hoc signed)
        run: make
      - name: Load it into CoreAudio on the runner
        run: |
          sudo make install
          sleep 8
          system_profiler SPAudioDataType > devices.txt
          cat devices.txt
          grep -q "Sotto Out" devices.txt && grep -q "Sotto In" devices.txt
      - name: Package
        run: cd build && ditto -c -k --keepParent SottoAudio.driver SottoAudio.driver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SottoAudio.driver
          path: build/SottoAudio.driver.zip
